name: Calculation fork
on:
  push:
    branches: [luko-simulation]
  pull_request:
    branches: [luko-simulation]
  workflow_dispatch:
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.99.1
  CARGO_TERM_COLOR: always
jobs:
  calculation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.99.1 fmt --all -- --check
      - run: cargo +1.99.1 test --locked -p ironcalc_base --lib
      - run: bash scripts/check-base-package.sh
      - run: cargo +1.99.1 test --locked -p ironcalc_base --doc
      - run: cargo +1.99.1 test --locked -p ironcalc_base --test calculation_failure_api
      - run: cargo +1.99.1 test --locked -p ironcalc --lib --test test_iterative_calculation
      - run: cargo +1.99.1 test --locked --release -p ironcalc_base configured_factorial_and_distinct_recursion_diagnostics
      - run: cargo +1.99.1 check -p ironcalc_base --target wasm32-unknown-unknown --locked
      - run: cargo +1.99.1 clippy --locked -p ironcalc_base --lib --tests -- -D warnings

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/nodejs
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.99.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global pnpm@9.15.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:debug
      - run: pnpm test
      - run: git diff --exit-code -- index.d.ts

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.99.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: ./run_tests.sh
        working-directory: bindings/python
      - name: Build Python documentation with warnings as errors
        run: |
          source bindings/python/venv/bin/activate
          python -m pip install sphinx furo
          bash scripts/check-python-docs.sh

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global pnpm@9.15.4
      - run: cargo +1.99.1 install --locked wasm-pack --version 0.15.1
      - run: make tests
        working-directory: bindings/wasm
      - name: Build browser package for workbook tests
        run: |
          make types.js
          wasm-pack build --dev --target web --scope ironcalc --out-dir pkg
          python3 fix_types.py pkg
          python3 fix_package.py pkg
        working-directory: bindings/wasm
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: webapp/IronCalc
      - run: npm run typecheck && npm test && npm run build && npm run check
        working-directory: webapp/IronCalc

  wasi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      # Preserve the existing WASI exclusions for tests that leak the mock clock.
      - run: cargo +1.99.1 test --locked -p ironcalc_base --target wasm32-wasip2 -- --skip test::test_now --skip test::test_today
        env:
          CARGO_TARGET_WASM32_WASIP2_RUNNER: wasmtime run --dir=.
