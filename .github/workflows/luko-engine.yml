name: Calculation fork
on:
  push:
    branches: [luko-simulation]
  pull_request:
    branches: [luko-simulation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calculation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - run: cargo +1.99.1 fmt --all -- --check
      - run: cargo +1.99.1 test -p ironcalc_base --lib
      - run: cargo +1.99.1 test -p ironcalc --lib --test test_iterative_calculation
      - run: cargo +1.99.1 check -p ironcalc_base --target wasm32-unknown-unknown --locked
      - run: cargo +1.99.1 clippy -p ironcalc_base --lib --tests -- -D warnings
